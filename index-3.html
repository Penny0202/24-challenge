<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>24 Challenge｜數字冒險</title>
<style>
:root{--bg:#fff7f4;--ink:#343046;--muted:#817b8c;--pink:#ff7199;--pink2:#ffe2eb;--purple:#8a74df;--yellow:#ffd77e;--white:#fff;--line:#f2e4ea;--shadow:0 16px 40px rgba(134,94,119,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"SF Pro Rounded","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 15%,#ffe0e9 0,transparent 35%),radial-gradient(circle at 90% 85%,#e9e5ff 0,transparent 40%),var(--bg)}button,select,input{font:inherit}button{cursor:pointer;border:0;transition:transform .15s,filter .15s}button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.02)}button:active:not(:disabled){transform:translateY(0)}button:disabled{opacity:.5;cursor:not-allowed}.shell{width:min(960px,calc(100% - 32px));margin:0 auto;padding:34px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:23px}.brand{display:flex;align-items:center;gap:12px}.logo{height:54px;width:54px;border-radius:18px;background:linear-gradient(135deg,#ff92aa,#f96292);display:grid;place-items:center;color:white;font-weight:950;font-size:25px;box-shadow:0 7px 0 #ffd2df;transform:rotate(-6deg)}h1{font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:-.8px}.subtitle{color:var(--muted);font-size:14px;margin:4px 0 0}.top-pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:14px;font-weight:750;white-space:nowrap}.board{background:rgba(255,255,255,.93);border:1px solid #fff;border-radius:30px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px)}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:24px}.controls label{font-size:13px;font-weight:750;color:var(--muted)}.controls select{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}.spacer{flex:1}.reset{background:#f7f2f8;padding:11px 16px;border-radius:12px;color:#766985;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{background:#fff7fa;border:1px solid #ffeaf1;border-radius:17px;padding:15px 10px;text-align:center}.stat:nth-child(2){background:#f7f3ff;border-color:#eee7ff}.stat:nth-child(3){background:#fffbec;border-color:#fff1cb}.stat:nth-child(4){background:#f4fbff;border-color:#e7f2fc}.stat .k{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.stat .v{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}.mission{text-align:center;margin:26px 0 18px}.eyebrow{font-weight:800;color:var(--purple);font-size:13px;letter-spacing:3px}.mission h2{font-size:clamp(24px,4vw,34px);margin:7px 0}.mission h2 span{color:var(--pink)}.mission p{margin:0;color:var(--muted);font-size:14px}.digits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:620px;margin:23px auto}.number{height:clamp(80px,15vw,112px);border-radius:22px;background:#fff;box-shadow:0 7px 0 #efdfeb,0 12px 25px #f5e6ed;color:var(--ink);font-size:clamp(32px,6vw,48px);font-weight:950;border:2px solid #f4eaf0}.number:nth-child(2){box-shadow:0 7px 0 #e2ddf8,0 12px 25px #f5e6ed}.number:nth-child(3){box-shadow:0 7px 0 #ffe4ae,0 12px 25px #f5e6ed}.number:nth-child(4){box-shadow:0 7px 0 #d9eaf6,0 12px 25px #f5e6ed}.number.used{opacity:.33;box-shadow:none;transform:none!important}.formula{border:2px dashed #e9dbe8;min-height:78px;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;word-break:break-word;background:#fdfaff;font-size:clamp(20px,4vw,30px);font-weight:800;letter-spacing:2px}.formula.empty{color:#b4a7ba;font-size:17px;letter-spacing:0}.pad{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin:18px auto;max-width:700px}.key{background:#f3effb;border-radius:13px;min-height:52px;color:#685e95;font-size:23px;font-weight:850}.key.utility{font-size:17px;background:#f7f4f6;color:#806d81}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:20px 0 6px}.primary{background:linear-gradient(135deg,#ff85a6,#f76598);color:white;box-shadow:0 6px 0 #e7a2bb;padding:15px 32px;font-weight:900;border-radius:15px;font-size:16px}.secondary{background:#f6f0ff;color:#785fc2;padding:15px 20px;font-weight:850;border-radius:15px}.next{background:#fff0d2;color:#9b6b20}.feedback{min-height:45px;margin:16px auto 2px;max-width:690px;text-align:center;font-size:15px;font-weight:700;line-height:1.6}.feedback.good{color:#21876d}.feedback.bad{color:#dc6480}.feedback.info{color:#8270ad}.rules{margin-top:24px;background:rgba(255,255,255,.76);border:1px solid white;border-radius:22px;padding:22px 26px}.rules h3{margin:0 0 10px}.rules p{margin:8px 0;color:#726a78;line-height:1.7;font-size:14px}.footer{text-align:center;color:#9a8d9e;font-size:12px;margin-top:22px}@media(max-width:600px){.top-pill{display:none}.board{border-radius:23px}.stats{gap:6px}.stat{padding:11px 3px;border-radius:12px}.stat .v{font-size:21px}.stat .k{font-size:11px}.digits{gap:8px}.number{border-radius:15px}.pad{grid-template-columns:repeat(4,1fr)}.key{min-height:48px}.actions button{flex:1;padding:13px 9px}.controls{gap:8px}.controls select{padding:9px 8px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="logo">24</div><div><h1>24 Challenge</h1><p class="subtitle">動動腦，讓四個數字變成 24！</p></div></div><div class="top-pill">最高分 <span id="bestTop">0</span></div></header>
<main class="board">
<div class="controls"><label for="mode">遊戲模式</label><select id="mode"><option value="practice">自由練習</option><option value="timed">限時挑戰（60 秒）</option></select><label for="difficulty">難度</label><select id="difficulty"><option value="easy">簡單</option><option value="normal" selected>普通</option><option value="hard">困難</option></select><div class="spacer"></div><button class="reset" id="restart">重新開始</button></div>
<div class="stats"><div class="stat"><span class="k">分數</span><span class="v" id="score">0</span></div><div class="stat"><span class="k">答對</span><span class="v" id="solved">0</span></div><div class="stat"><span class="k">連勝</span><span class="v" id="streak">0</span></div><div class="stat"><span class="k">剩餘時間</span><span class="v" id="time">∞</span></div></div>
<div class="mission"><div class="eyebrow">YOUR MISSION</div><h2>挑戰算出 <span>24</span>！</h2><p>四個數字都要使用，而且每個只能用一次</p></div>
<div class="digits" id="digits" aria-label="本題的四個數字"></div>
<div id="formula" class="formula empty" aria-live="polite">點擊上方數字卡片開始組合算式</div>
<div class="pad" aria-label="運算按鍵"><button class="key" data-op="+">+</button><button class="key" data-op="-">−</button><button class="key" data-op="*">×</button><button class="key" data-op="/">÷</button><button class="key" data-op="(">(</button><button class="key" data-op=")">)</button><button class="key utility" id="undo">復原</button><button class="key utility" id="clear">清除</button></div>
<div class="actions"><button class="secondary" id="hint">提示</button><button class="primary" id="submit">提交答案</button><button class="secondary next" id="next">下一題</button></div>
<div class="feedback" id="feedback" role="status" aria-live="polite">準備好開始挑戰了嗎？</div>
</main>
<section class="rules"><h3>遊戲規則</h3><p>用四個數字與加、減、乘、除、括號組成算式，計算結果必須等於 24。每個數字都要使用且只能使用一次；運算符號可以重複。數字請點擊上方卡片輸入，括號與運算符號請點擊下方按鍵。</p><p><b>自由練習</b>：沒有時間限制，可以查看提示。<b>限時挑戰</b>：60 秒內盡可能答對更多題目，每題 100 分，快速解答還有額外時間獎勵。提示會扣除該題 30 分。</p></section>

</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), el={mode:$('mode'),difficulty:$('difficulty'),digits:$('digits'),formula:$('formula'),feedback:$('feedback'),score:$('score'),solved:$('solved'),streak:$('streak'),time:$('time'),best:$('bestTop'),submit:$('submit'),hint:$('hint'),next:$('next')};
const bestKey='challenge24_best_v1';let best=0;try{best=Number(localStorage.getItem(bestKey))||0}catch{};el.best.textContent=best;
let numbers=[],tokens=[],solution='',score=0,solved=0,streak=0,roundDone=false,usedHint=false,seconds=60,roundStart=Date.now(),timer=null,gameEnded=false;
const close=(a,b)=>Math.abs(a-b)<1e-8;
// Return an actual expression, not just a yes/no answer. All four numbers are used exactly once.
function solve(nums){const terms=nums.map(n=>({n,e:String(n),ops:0,div:0,depth:0}));let solutions=[];
function explore(items){if(items.length===1){if(close(items[0].n,24))solutions.push(items[0]);return}for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
let a=items[i],b=items[j],rest=items.filter((_,k)=>k!==i&&k!==j),m=[{n:a.n+b.n,e:`(${a.e}+${b.e})`,ops:a.ops+b.ops+1,div:a.div+b.div,depth:Math.max(a.depth,b.depth)+1},{n:a.n*b.n,e:`(${a.e}×${b.e})`,ops:a.ops+b.ops+1,div:a.div+b.div,depth:Math.max(a.depth,b.depth)+1},{n:a.n-b.n,e:`(${a.e}−${b.e})`,ops:a.ops+b.ops+1,div:a.div+b.div,depth:Math.max(a.depth,b.depth)+1},{n:b.n-a.n,e:`(${b.e}−${a.e})`,ops:a.ops+b.ops+1,div:a.div+b.div,depth:Math.max(a.depth,b.depth)+1}];if(!close(b.n,0))m.push({n:a.n/b.n,e:`(${a.e}÷${b.e})`,ops:a.ops+b.ops+1,div:a.div+b.div+1,depth:Math.max(a.depth,b.depth)+1});if(!close(a.n,0))m.push({n:b.n/a.n,e:`(${b.e}÷${a.e})`,ops:a.ops+b.ops+1,div:a.div+b.div+1,depth:Math.max(a.depth,b.depth)+1});for(let item of m)if(Number.isFinite(item.n))explore([...rest,item]);}}
explore(terms);return solutions.sort((a,b)=>a.div-b.div||a.depth-b.depth)[0]||null;}
// Difficulty controls the kinds of generated numbers, not an unprovable claim about human difficulty.
function createPuzzle(){let candidate=null;for(let tries=0;tries<450;tries++){let max=el.difficulty.value==='easy'?9:13;const ns=Array.from({length:4},()=>1+Math.floor(Math.random()*max));let answer=solve(ns);if(!answer)continue;if(el.difficulty.value==='easy'&&(answer.div>0||ns.some(n=>n>9)))continue;if(el.difficulty.value==='hard'&&answer.div===0&&tries<350)continue;candidate={ns,answer:answer.e};break;}if(!candidate)candidate={ns:[1,3,4,6],answer:'(6÷(1−(3÷4)))'};return candidate;}
function msg(str,type='info'){el.feedback.textContent=str;el.feedback.className='feedback '+type}
function showTokens(){let str=tokens.map(t=>t.display).join(' ');el.formula.textContent=str||'點擊上方數字卡片開始組合算式';el.formula.classList.toggle('empty',!str);el.digits.querySelectorAll('button').forEach((b,i)=>{const used=tokens.some(t=>t.type==='num'&&t.idx===i);b.disabled=used||roundDone||gameEnded;b.classList.toggle('used',used)})}
function renderStats(){el.score.textContent=score;el.solved.textContent=solved;el.streak.textContent=streak;el.time.textContent=el.mode.value==='practice'?'∞':seconds+'s';el.best.textContent=best}
function newRound(){if(gameEnded)return;const p=createPuzzle();numbers=p.ns;solution=p.answer;tokens=[];roundDone=false;usedHint=false;roundStart=Date.now();el.digits.replaceChildren();numbers.forEach((n,i)=>{const b=document.createElement('button');b.className='number';b.textContent=n;b.title='使用數字 '+n;b.setAttribute('aria-label','第 '+(i+1)+' 個數字：'+n);b.addEventListener('click',()=>{if(roundDone||gameEnded||tokens.some(t=>t.idx===i))return;tokens.push({type:'num',idx:i,display:String(n),raw:String(n)});showTokens()});el.digits.appendChild(b)});el.submit.disabled=false;el.hint.disabled=false;showTokens();msg('小提示：可以使用括號來改變運算順序！')}
// Small recursive-descent arithmetic parser: no eval(), no arbitrary JavaScript execution.
function calculate(expr){const s=expr.replace(/\s+/g,''), t=s.match(/\d+(?:\.\d+)?|[()+\-*/]/g);if(!t||t.join('')!==s)throw Error('算式包含無法辨識的符號');let p=0;
function factor(){let x=t[p];if(x==='+'||x==='-'){p++;let y=factor();return x==='-'?-y:y}if(x==='('){p++;const y=sum();if(t[p++]!==')')throw Error('請檢查括號是否配對');return y}if(x!==undefined&&/^\d/.test(x)){p++;return Number(x)}throw Error('算式還沒完成喔')}
function term(){let y=factor();while(t[p]==='*'||t[p]==='/'){const op=t[p++],z=factor();if(op==='/'&&close(z,0))throw Error('不可以除以 0');y=op==='*'?y*z:y/z}return y}
function sum(){let y=term();while(t[p]==='+'||t[p]==='-'){const op=t[p++],z=term();y=op==='+'?y+z:y-z}return y}
const v=sum();if(p!==t.length||!Number.isFinite(v))throw Error('算式格式有誤');return v;}
function submit(){if(roundDone||gameEnded)return;if(tokens.filter(t=>t.type==='num').length!==4){msg('四個數字都要使用一次才能提交喔！','bad');return}try{const expression=tokens.map(t=>t.raw).join('');const value=calculate(expression);if(!close(value,24)){streak=0;renderStats();msg('目前結果是 '+Number(value.toFixed(5))+'，還不是 24，再試試看！','bad');return}roundDone=true;solved++;streak++;let earned=el.mode.value==='timed'?100+Math.min(50,Math.max(0,Math.floor((30-(Date.now()-roundStart)/1000)*2))):100;if(usedHint)earned=Math.max(10,earned-30);score+=earned;if(score>best){best=score;try{localStorage.setItem(bestKey,String(best))}catch{}}el.submit.disabled=true;el.hint.disabled=true;showTokens();renderStats();msg('答對啦！恭喜得到 '+earned+' 分，點「下一題」繼續挑戰！','good')}catch(e){msg(e.message,'bad')}}
function finish(){gameEnded=true;clearInterval(timer);el.submit.disabled=true;el.hint.disabled=true;el.next.disabled=true;showTokens();msg('時間到！本次答對 '+solved+' 題，總分 '+score+' 分！點「重新開始」再挑戰一次。','good')}
function restart(){clearInterval(timer);score=0;solved=0;streak=0;seconds=60;gameEnded=false;roundDone=false;el.next.disabled=false;renderStats();newRound();if(el.mode.value==='timed'){timer=setInterval(()=>{seconds--;renderStats();if(seconds<=0)finish()},1000)}}
$('submit').addEventListener('click',submit);$('clear').addEventListener('click',()=>{if(roundDone||gameEnded)return;tokens=[];showTokens()});$('undo').addEventListener('click',()=>{if(roundDone||gameEnded)return;tokens.pop();showTokens()});document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>{if(roundDone||gameEnded)return;const v=b.dataset.op;tokens.push({type:'op',display:({'+':'+','-':'−','*':'×','/':'÷'})[v]||v,raw:v});showTokens()}));el.hint.addEventListener('click',()=>{if(roundDone||gameEnded)return;usedHint=true;msg('參考解法：'+solution+' = 24（本題得分會減少 30 分）','info')});el.next.addEventListener('click',()=>{if(gameEnded)return;if(!roundDone)streak=0;renderStats();newRound()});$('restart').addEventListener('click',restart);el.mode.addEventListener('change',restart);el.difficulty.addEventListener('change',restart);restart();
})();
</script>
</body>
</html>
